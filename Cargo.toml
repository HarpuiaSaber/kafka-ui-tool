[package]
name = "kafka-ui-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.13"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rdkafka = { version = "0.39", features = ["cmake-build", "ssl-vendored"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.13"
